version: 2
# Dependabot only reads this file from the default branch (master). The
# ruby-* branches are covered from here by the entries with `target-branch`,
# so keep this file in step with the branches (see "Branches" in README.md).
#
# Each branch is pinned to one Ruby series: the bundler entries resolve gems
# for the Ruby given in that branch's Gemfile, and the docker entries ignore
# Ruby images newer than that series.
updates:

# master (Ruby 4.0)
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
  versioning-strategy: lockfile-only
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: daily
  ignore:
  - dependency-name: ruby
    versions:
    - ">= 4.1"
- package-ecosystem: docker
  directory: "/ci/ruby4.0"
  schedule:
    interval: daily
  ignore:
  - dependency-name: ruby
    versions:
    - ">= 4.1"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily

# ruby-3.4
